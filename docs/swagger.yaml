basePath: /api/v1
definitions:
  dto.CreateContainerRequest:
    properties:
      description:
        type: string
      location_id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      project_id:
        type: string
    required:
    - name
    type: object
  dto.CreateItemRequest:
    properties:
      category_id:
        type: string
      container_id:
        type: string
      description:
        type: string
      individual_notes:
        type: string
      item_type_id:
        type: string
      name:
        type: string
      origin_location_id:
        type: string
      quantity:
        type: integer
      serial_number:
        type: string
    type: object
  dto.UpdateCategoryInput:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  handlers.UpdateItemInput:
    properties:
      category_id:
        type: string
      container_id:
        type: string
      description:
        type: string
      individual_notes:
        type: string
      item_type_id:
        type: string
      name:
        type: string
      origin_location_id:
        type: string
      quantity:
        type: integer
      serial_number:
        type: string
    type: object
  models.ActivityLog:
    properties:
      action:
        description: e.g., "CREATED", "MODIFIED", "DELETED", "MOVED", "CHECK_IN",
          "CHECK_OUT", "QUANTITY_ADJUSTED", "ASSIGNED_TO_PROJECT", "RETURNED_FROM_PROJECT"
        type: string
      created_at:
        type: string
      details:
        type: string
      entity_id:
        type: string
      entity_type:
        description: e.g., "Item", "Container", "Location"
        type: string
      from_container:
        $ref: '#/definitions/models.Container'
      from_container_id:
        type: string
      id:
        type: string
      project:
        $ref: '#/definitions/models.Project'
      project_id:
        type: string
      quantity_change:
        type: integer
      to_container:
        $ref: '#/definitions/models.Container'
      to_container_id:
        type: string
      updated_at:
        type: string
      user_id:
        description: 'Optional: If we ever add users'
        type: string
    type: object
  models.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Container:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      location:
        $ref: '#/definitions/models.Location'
      location_id:
        type: string
      name:
        type: string
      parent:
        $ref: '#/definitions/models.Container'
      parent_id:
        type: string
      project:
        $ref: '#/definitions/models.Project'
      project_id:
        type: string
      updated_at:
        type: string
    type: object
  models.Item:
    properties:
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      checked_out:
        type: boolean
      container:
        $ref: '#/definitions/models.Container'
      container_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      individual_notes:
        type: string
      item_type:
        $ref: '#/definitions/models.ItemType'
      item_type_id:
        type: string
      last_check_out_time:
        type: string
      name:
        description: Used if ItemType is not provided
        type: string
      origin_location:
        $ref: '#/definitions/models.Location'
      origin_location_id:
        type: string
      quantity:
        type: integer
      serial_number:
        type: string
      updated_at:
        type: string
    type: object
  models.ItemType:
    properties:
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      manufacturer:
        type: string
      name:
        type: string
      part_number:
        type: string
      specifications:
        type: string
      updated_at:
        type: string
    type: object
  models.Location:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Project:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        description: e.g., "active", "completed", "archived"
        type: string
      updated_at:
        type: string
    type: object
