basePath: /api/v1
definitions:
  dto.AuditItemRequest:
    properties:
      notes:
        type: string
      physical_count:
        type: integer
    type: object
  dto.AuditSummaryResponse:
    properties:
      negative_drift:
        type: integer
      net_drift:
        type: integer
      positive_drift:
        type: integer
      total_audits:
        type: integer
      total_items:
        type: integer
    type: object
  dto.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CreateCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateContainerRequest:
    properties:
      description:
        type: string
      location_id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      project_id:
        type: string
    required:
    - name
    type: object
  dto.CreateItemRequest:
    properties:
      barcode:
        type: string
      category_id:
        type: string
      container_id:
        type: string
      description:
        type: string
      individual_notes:
        type: string
      item_type_id:
        type: string
      min_quantity:
        type: integer
      name:
        type: string
      origin_location_id:
        type: string
      quantity:
        type: integer
      reorder_quantity:
        type: integer
      serial_number:
        type: string
      sku:
        type: string
    type: object
  dto.CreateItemTypeRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      manufacturer:
        type: string
      min_quantity:
        type: integer
      name:
        type: string
      parameters:
        items:
          type: integer
        type: array
      part_number:
        type: string
      reorder_quantity:
        type: integer
      specifications:
        type: string
    required:
    - name
    type: object
  dto.CreateLocationRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        description: Optional, defaults to "user"
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.UpdateCategoryInput:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dto.UpdateContainerInput:
    properties:
      description:
        type: string
      location_id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      project_id:
        type: string
    type: object
  dto.UpdateItemTypeInput:
    properties:
      category_id:
        type: string
      description:
        type: string
      manufacturer:
        type: string
      min_quantity:
        type: integer
      name:
        type: string
      parameters:
        items:
          type: integer
        type: array
      part_number:
        type: string
      reorder_quantity:
        type: integer
      specifications:
        type: string
    type: object
  dto.UpdateLocationInput:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handlers.UpdateItemInput:
    properties:
      barcode:
        type: string
      category_id:
        type: string
      container_id:
        type: string
      description:
        type: string
      individual_notes:
        type: string
      item_type_id:
        type: string
      min_quantity:
        type: integer
      name:
        type: string
      origin_location_id:
        type: string
      quantity:
        type: integer
      reorder_quantity:
        type: integer
      serial_number:
        type: string
      sku:
        type: string
    type: object
  models.ActivityLog:
    properties:
      action:
        description: e.g., "CREATED", "MODIFIED", "DELETED", "MOVED", "CHECK_IN",
          "CHECK_OUT", "QUANTITY_ADJUSTED", "ASSIGNED_TO_PROJECT", "RETURNED_FROM_PROJECT"
        type: string
      created_at:
        type: string
      details:
        type: string
      entity_id:
        type: string
      entity_type:
        description: e.g., "Item", "Container", "Location"
        type: string
      from_container:
        $ref: '#/definitions/models.Container'
      from_container_id:
        type: string
      id:
        type: string
      project:
        $ref: '#/definitions/models.Project'
      project_id:
        type: string
      quantity_change:
        type: integer
      to_container:
        $ref: '#/definitions/models.Container'
      to_container_id:
        type: string
      updated_at:
        type: string
      user_id:
        description: 'Optional: Set when user performs action'
        type: string
    type: object
  models.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Container:
    properties:
      barcode:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      location:
        $ref: '#/definitions/models.Location'
      location_id:
        type: string
      name:
        type: string
      parent:
        $ref: '#/definitions/models.Container'
      parent_id:
        type: string
      project:
        $ref: '#/definitions/models.Project'
      project_id:
        type: string
      updated_at:
        type: string
    type: object
  models.Item:
    properties:
      barcode:
        type: string
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      checked_out:
        type: boolean
      container:
        $ref: '#/definitions/models.Container'
      container_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      individual_notes:
        type: string
      item_type:
        $ref: '#/definitions/models.ItemType'
      item_type_id:
        type: string
      last_check_out_time:
        type: string
      min_quantity:
        type: integer
      name:
        description: Used if ItemType is not provided
        type: string
      origin_location:
        $ref: '#/definitions/models.Location'
      origin_location_id:
        type: string
      quantity:
        type: integer
      reorder_quantity:
        type: integer
      serial_number:
        type: string
      sku:
        type: string
      updated_at:
        type: string
    type: object
  models.ItemType:
    properties:
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      manufacturer:
        type: string
      min_quantity:
        type: integer
      name:
        type: string
      parameters:
        items:
          type: integer
        type: array
      part_number:
        type: string
      reorder_quantity:
        type: integer
      specifications:
        type: string
      updated_at:
        type: string
    type: object
  models.Location:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Project:
    properties:
      allocated_cost:
        type: number
      budget:
        type: number
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/models.User'
      owner_id:
        type: string
      phase:
        description: e.g. Concept, Definition, Design, Integration, Operations, Closeout
        type: string
      start_date:
        type: string
      status:
        description: e.g. Active, Planning, InReview, Completed, Archived
        type: string
      target_end_date:
        type: string
      trl:
        description: Target Technology Readiness Level (1-9)
        type: integer
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        description: e.g., "admin", "user"
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A comprehensive inventory management system backend for electronic
    components.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Invelog API
  version: "1.0"
paths:
  /activity-logs:
    get:
      description: Get all activity logs
      parameters:
      - description: Limit (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ActivityLog'
            type: array
      summary: List Activity Logs
      tags:
      - Activity Logs
  /audit/summary:
    get:
      description: Get audit reconciliation summary metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuditSummaryResponse'
      summary: Get Audit Summary
      tags:
      - Audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get JWT token
      parameters:
      - description: Login Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login User
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Register Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register User
      tags:
      - Auth
  /categories:
    get:
      description: Get all categories
      parameters:
      - description: Limit (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
      summary: List Categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Category Data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Category
      tags:
      - Categories
  /categories/{id}:
    delete:
      description: Delete a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete Category
      tags:
      - Categories
    get:
      description: Get a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Category'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Category
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Update a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category Data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update Category
      tags:
      - Categories
  /containers:
    get:
      description: Get all containers
      parameters:
      - description: Limit (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Container'
            type: array
      summary: List Containers
      tags:
      - Containers
    post:
      consumes:
      - application/json
      description: Create a new container
      parameters:
      - description: Container Data
        in: body
        name: container
        required: true
        schema:
          $ref: '#/definitions/dto.CreateContainerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Container'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Container
      tags:
      - Containers
  /containers/{id}:
    delete:
      description: Delete a container by ID
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete Container
      tags:
      - Containers
    get:
      description: Get a container by ID
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Container'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Container
      tags:
      - Containers
    put:
      consumes:
      - application/json
      description: Update a container by ID
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      - description: Container Data
        in: body
        name: container
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateContainerInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Container'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update Container
      tags:
      - Containers
  /health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - System
  /item-types:
    get:
      description: Get all item types with optional parametric filters (e.g. param.package=0805)
      parameters:
      - description: Limit (default 100, max 1000)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ItemType'
            type: array
      summary: List ItemTypes
      tags:
      - ItemTypes
    post:
      consumes:
      - application/json
      description: Create a new item type
      parameters:
      - description: ItemType Data
        in: body
        name: itemType
        required: true
        schema:
          $ref: '#/definitions/dto.CreateItemTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ItemType'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create ItemType
      tags:
      - ItemTypes
  /item-types/{id}:
    delete:
      description: Delete an item type by ID
      parameters:
      - description: ItemType ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete ItemType
      tags:
      - ItemTypes
    get:
      description: Get an item type by ID
      parameters:
      - description: ItemType ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ItemType'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get ItemType
      tags:
      - ItemTypes
    put:
      consumes:
      - application/json
      description: Update an item type by ID
      parameters:
      - description: ItemType ID
        in: path
        name: id
        required: true
        type: string
      - description: ItemType Data
        in: body
        name: itemType
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateItemTypeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ItemType'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update ItemType
      tags:
      - ItemTypes
  /item-types/low-stock:
    get:
      description: Query component types where aggregate quantity across containers
        drops below configured min_quantity
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ItemType'
            type: array
      summary: Get Low Stock ItemTypes
      tags:
      - ItemTypes
  /items:
    get:
      description: Get items (paginated)
      parameters:
      - description: Limit (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Item'
            type: array
      summary: List Items
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: Create a new item
      parameters:
      - description: Item Data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/dto.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Item
      tags:
      - Items
  /items/{id}:
    delete:
      description: Delete an item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete Item
      tags:
      - Items
    get:
      description: Get an item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Item
      tags:
      - Items
    put:
      consumes:
      - application/json
      description: Update an item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Item Update Data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateItemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update Item
      tags:
      - Items
  /items/{id}/audit:
    post:
      consumes:
      - application/json
      description: Cycle count audit reconciliation for an item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Audit Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuditItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Audit Item
      tags:
      - Audit
  /items/{id}/checkin:
    post:
      description: Check in an item by marking it as not checked out and logging the
        activity
      parameters:
      - description: Item ID
